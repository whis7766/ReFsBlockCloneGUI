name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test mode: quick | full | auto"
        required: false
        default: "auto"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build Release x64 (production, no test hooks/PDB)
        run: msbuild ReFsBlockCloneGUI.sln /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64 /m /v:m

      - name: Build Debug x64 for GUI smoke test only
        run: msbuild test\GuiSmokeTest.csproj /p:Configuration=Debug /p:Platform=x64 /p:PreferredToolArchitecture=x64 /m /v:m

      - name: Prepare real ReFS test volumes (4K + 64K clusters)
        run: powershell -ExecutionPolicy Bypass -File scripts\New-ReFsTestVolumes.ps1

      - name: Decide test mode
        id: mode
        run: |
          $free = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          $m = "${{ github.event.inputs.mode }}"
          if (-not $m -or $m -eq "auto") { $m = if ($free -gt 12) { "full" } else { "quick" } }
          Write-Host "C: free ${free} GB -> test mode $m"
          "mode=$m" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Chunk-size and write-volume benchmark (VHDX growth = host writes)
        run: |
          $vhdx = "C:\refs_vhd\refs4k.vhdx"
          New-Item -ItemType Directory -Force -Path R:\bench | Out-Null
          $src = "R:\bench\src.bin"
          $buf = New-Object byte[] 1MB
          $rng = New-Object Random 5
          $fs = [IO.File]::Create($src)
          for ($i = 0; $i -lt 2048; $i++) { $rng.NextBytes($buf); $fs.Write($buf, 0, $buf.Length) }
          $fs.Flush($true)
          $fs.Close()
          $lines = @()
          foreach ($mb in @(100, 1024, 3072)) {
            $dst = "R:\bench\dst.bin"
            $before = (Get-Item $vhdx).Length
            $out = & test\x64\Release\ReFsCloneTest.exe bench $src $dst $mb
            if ($LASTEXITCODE -ne 0) { Write-Host $out; exit 1 }
            $after = (Get-Item $vhdx).Length
            $lines += "$out vhdx_growth_bytes=$($after - $before)"
            Remove-Item $dst -Force
          }
          # integrity-on source: checksum metadata write cost at 1 GB chunks
          $src2 = "R:\bench\src_int.bin"
          $fs = [IO.File]::Create($src2)
          for ($i = 0; $i -lt 1024; $i++) { $rng.NextBytes($buf); $fs.Write($buf, 0, $buf.Length) }
          $fs.Flush($true)
          $fs.Close()
          Set-FileIntegrity -FileName $src2 -Enable $True
          $f2 = [IO.File]::Open($src2, 'Open', 'ReadWrite', 'Read'); $f2.Flush($true); $f2.Close()
          $before = (Get-Item $vhdx).Length
          $out = & test\x64\Release\ReFsCloneTest.exe bench $src2 "R:\bench\dst_int.bin" 1024
          if ($LASTEXITCODE -ne 0) { Write-Host $out; exit 1 }
          $after = (Get-Item $vhdx).Length
          $lines += "$out integrity=on vhdx_growth_bytes=$($after - $before)"
          Remove-Item "R:\bench\dst_int.bin" -Force
          Remove-Item $src, $src2 -Force
          $lines | Tee-Object -FilePath bench.log

      - name: Engine verification on real ReFS volumes
        run: |
          & test\x64\Release\ReFsCloneTest.exe R S ${{ steps.mode.outputs.mode }} *>&1 | Tee-Object -FilePath engine-test.log
          $code = $LASTEXITCODE
          Write-Host "engine exit code: $code"
          exit $code

      - name: Headless CLI check (success + cross-volume rejection)
        run: |
          $exe = "src\x64\Release\ReFsBlockCloneGUI.exe"
          New-Item -ItemType Directory -Force -Path R:\cli | Out-Null
          $src = "R:\cli\src.bin"; $dst = "R:\cli\dst.bin"
          $bytes = New-Object byte[] (4MB + 123)
          (New-Object Random 7).NextBytes($bytes)
          [IO.File]::WriteAllBytes($src, $bytes)
          # WinExe (GUI subsystem): PowerShell '&' does not wait nor set
          # $LASTEXITCODE for GUI apps; Start-Process -Wait -PassThru does.
          $p = Start-Process -FilePath $exe -ArgumentList "`"$src`"","`"$dst`"" -Wait -PassThru -NoNewWindow
          $ok = $p.ExitCode
          Write-Host "CLI success exit: $ok"
          if ($ok -ne 0) { exit 1 }
          if (-not (Test-Path $dst)) { Write-Host "dst missing"; exit 1 }
          if ((Get-FileHash $src).Hash -ne (Get-FileHash $dst).Hash) { Write-Host "hash mismatch"; exit 1 }
          $p2 = Start-Process -FilePath $exe -ArgumentList "`"$src`"","`"C:\cli_should_fail.dst`"" -Wait -PassThru -NoNewWindow
          $bad = $p2.ExitCode
          Write-Host "CLI cross-volume exit: $bad"
          if ($bad -ne 1) { exit 1 }
          if (Test-Path "C:\cli_should_fail.dst") { Write-Host "orphan on NTFS"; exit 1 }
          Write-Host "--- headless log tail ---"
          Get-Content refsclone_headless.log -Tail 25

      - name: GUI smoke test with state screenshots
        run: |
          New-Item -ItemType Directory -Force -Path gui-shots | Out-Null
          & test\x64\Debug\GuiSmokeTest.exe R gui-shots C dialogs *>&1 | Tee-Object -FilePath gui-test.log
          $code = $LASTEXITCODE
          Write-Host "gui exit code: $code"
          exit $code

      - name: Upload test results, screenshots and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            engine-test.log
            gui-test.log
            bench.log
            gui-shots/*.png
            refsclone_headless.log
            src/x64/Release/ReFsBlockCloneGUI.exe
            src/x64/Release/ReFsBlockCloneGUI.exe.config
            test/x64/Release/ReFsCloneTest.exe
            test/x64/Debug/GuiSmokeTest.exe
          if-no-files-found: warn